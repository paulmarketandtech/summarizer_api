services:
  api:
    build: .
    container_name: summarizer-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./main.py:/app/main.py
    command:
      ["fastapi", "dev", "main.py", "--host", "0.0.0.0", "--port", "8000"]

volumes:

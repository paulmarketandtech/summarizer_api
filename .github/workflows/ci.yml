name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Lint (Style Check)
        run: uv run ruff check app/

      - name: Type Check (Static Analysis)
        run: uv run mypy app/ --ignore-missing-imports
        continue-on-error: true 

      - name: Run Migrations (Alembic)
        # CRITICAL: CI DB is empty. You must upgrade head before testing.
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: uv run alembic upgrade head

      - name: Run Tests
        env:
          DATABASE_URL_APP: postgresql://test_user:test_password@localhost:5432/test_db
          DATABASE_URL_APP: postgresql://test_user:test_password@localhost:5432/test_db
          OLLAMA_URL: http://localhost:9999 
          ADMIN_API_KEY: test-key
        run: uv run pytest tests/ -v

      # 2. If tests pass, build the Docker Image
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
